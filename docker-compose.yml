services:
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    env_file: [.env]
    environment:
      DATABASE_PATH: /data/vataic.db
      ARTIFACT_DIR: /data/artifacts
    ports: ["5000:5000"]
    volumes:
      - ./data:/data
      # Source bind mounts: logic/template changes load with a plain
      # `docker compose restart` — rebuild only when dependencies change.
      - ./app:/srv/app
      - ./worker:/srv/worker
      - ./migrations:/srv/migrations
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: [.env]
    environment:
      DATABASE_PATH: /data/vataic.db
      ARTIFACT_DIR: /data/artifacts
    volumes:
      - ./data:/data
      - ./app:/srv/app
      - ./worker:/srv/worker
      - ./migrations:/srv/migrations
    depends_on: [web]
