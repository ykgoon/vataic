services:
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    # Override Dockerfile CMD without rebuilding: the 30s default worker
    # timeout killed requests that queued behind SQLite write contention
    # (CRITICAL WORKER TIMEOUT in logs mid-delete), one worker starved the
    # 3s dashboard polls, and default logging hid request durations.
    command: ["sh", "-c", "python -m app.migrate; exec gunicorn 'app:create_app()' -b 0.0.0.0:5000 --timeout 120 --workers 2 --access-logfile - --access-logformat '%(t)s %(r)s -> %(s)s %(D)sus' --capture-output"]
    env_file: [.env]
    environment:
      DATABASE_PATH: /data/vataic.db
      ARTIFACT_DIR: /data/artifacts
    ports: ["5000:5000"]
    # Tailscale reachability (issue: LLM provider lives on a tailnet host):
    # 100.100.100.100 is the tailnet MagicDNS resolver, so documented
    # hostnames (e.g. LLM_BASE_URL=http://<ts-host>:port/v1) resolve from
    # inside containers; 1.1.1.1 is the fallback for when the tailscaled
    # resolver is unreachable. Containers reach the tailnet via the host's
    # tailscale0 interface (bridge NATs out through it) — no host network
    # namespace sharing, so the published port keeps working. Do NOT pin
    # tailnet IPs via extra_hosts: /etc/hosts outranks DNS and a stale IP
    # would break resolution even while MagicDNS is healthy.
    dns: [100.100.100.100, 1.1.1.1]
    volumes:
      - ./data:/data
      # Source bind mounts: logic/template changes load with a plain
      # `docker compose restart` — rebuild only when dependencies change.
      - ./app:/srv/app
      - ./worker:/srv/worker
      - ./migrations:/srv/migrations
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: [.env]
    environment:
      DATABASE_PATH: /data/vataic.db
      ARTIFACT_DIR: /data/artifacts
    # Same tailnet reachability as web (LLM calls happen here).
    dns: [100.100.100.100, 1.1.1.1]
    volumes:
      - ./data:/data
      - ./app:/srv/app
      - ./worker:/srv/worker
      - ./migrations:/srv/migrations
    depends_on: [web]
