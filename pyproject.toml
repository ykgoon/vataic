[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vataic"
version = "0.1.0"
description = "Vataic world projector - durable scenario laboratory"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "gunicorn>=21.0",
  "requests>=2.31",
  "numpy>=1.26",
  "pydantic>=2.0",
  "scikit-learn>=1.3",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
