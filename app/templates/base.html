<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vataic{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="/" class="brand-logo">Vataic</a>
      </div>
      <nav class="main-nav">
        <a href="/" class="nav-link">Scenarios</a>
        <a href="/scenarios/new" class="nav-link">New Scenario</a>
        <a href="/settings" class="nav-link">Settings</a>
      </nav>
    </div>
  </header>
  <main class="site-main">
    <div class="container">
      {% if messages %}
        <div class="status-flash">
          {% for m in messages %}
            <div class="flash flash-{{ m.type if m.type else 'info' }}">{{ m.message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">
      <span class="muted">Vataic &mdash; Structured scenario projection engine</span>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
