{% extends "base.html" %}
{% block title %}Scenarios — Vataic{% endblock %}
{% block content %}
<div class="scenarios-dashboard">
  <div class="dashboard-header">
    <h1>Scenarios</h1>
    <a href="/scenarios/new" class="btn btn-primary">+ New Scenario</a>
  </div>
  <div class="scenarios-table-wrapper">
    <table class="scenarios-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Premise</th>
          <th>Status</th>
          <th>Step</th>
          <th>Updated</th>
          <th>Error</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="scenarios-tbody"
               hx-get="/scenarios/partial"
               hx-trigger="every 3s"
               hx-swap="innerHTML">
        {% include "scenarios/partial.html" %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
