{# Fan chart htmx partial: tabs + chart for the selected factor #}
<div class="tabs" role="tablist">
  {% for f in fv["factors"] %}
  <button class="tab {{ 'on' if f['id'] == factor['id'] else '' }}"
          hx-get="/results/{{ jid }}/fan?factor={{ f['id'] }}"
          hx-target="#fan-panel .fan-zone" hx-swap="innerHTML">{{ f["name"] }}</button>
  {% endfor %}
</div>
<div class="fan-zone">
  {{ fan_html|safe }}
  {% if legend %}
  <ul class="fan-legend">
    {% for item in legend %}{{ item|safe }}{% endfor %}
    <li><span class="sw sw-dash"></span>baseline</li>
  </ul>
  {% endif %}
</div>
